<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RealEstate World – Upper East Side</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fc3e6;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff}
canvas{display:block}
#join{position:fixed;inset:0;display:flex;align-items:center;padding:0 3vw;z-index:10;pointer-events:none;background:linear-gradient(90deg,#0b1522ee 0,#0b152200 62%)}
#card{pointer-events:auto;background:#16212fee;border:1px solid #2c3f56;border-radius:14px;padding:20px;width:min(400px,94vw);max-height:92vh;overflow:auto;box-shadow:0 10px 40px #0008}
h1{margin:0 0 2px;font-size:21px}.sub{margin:0 0 12px;color:#9fb3c8;font-size:13px}
label{font-size:12px;color:#9fb3c8;display:block;margin:8px 0 4px}
input{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #2c3f56;background:#0f1824;color:#fff;font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:2px solid #2c3f56;border-radius:8px;padding:5px 10px;cursor:pointer;background:#0f1824;font-size:12px}
.sw{width:26px;height:26px;border-radius:50%;padding:0}
.opt.sel{border-color:#fff}
.firms{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.firm{border:2px solid #2c3f56;border-radius:9px;padding:6px 8px;cursor:pointer;background:#0f1824;font-size:12px}
.firm b{display:block;font-size:13px}.firm span{color:#9fb3c8;font-size:11px}.firm.sel{border-color:var(--c);background:#1b2a3d}
#go{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:#3b82f6;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
#hud{position:fixed;left:12px;top:12px;background:#0009;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;display:none}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#0009;padding:7px 14px;border-radius:10px;font-size:13px;display:none}
</style></head><body>
<div id="join"><div id="card">
<h1>RealEstate World</h1><p class="sub">Upper East Side &middot; New York. Create your agent, pick a brokerage, enter the shared city.</p>
<label>Agent name</label><input id="name" maxlength="16" placeholder="e.g. Alex Rivera" autocomplete="off">
<div id="looks"></div>
<label>Brokerage</label><div class="firms" id="firms"></div>
<button id="go">Enter the city</button>
</div></div>
<div id="hud"></div><div id="hint">WASD / arrows to move &middot; drag mouse or Q / E to rotate camera</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const FIRMS=[{n:'Vantage Realty',c:0xe74c3c,adv:'Better lead generation'},{n:'Haven & Co.',c:0x2ecc71,adv:'Relationships decay slower'},{n:'Sterling Estates',c:0xf1c40f,adv:'High-value listings'},{n:'Northstar Realty',c:0x3498db,adv:'Better market intelligence'},{n:'Cornerstone Realty',c:0xe67e22,adv:'Stronger local networking'},{n:'Elevate Properties',c:0x9b59b6,adv:'Faster information gathering'}];
const SKIN=[0xf1c9a5,0xd9a47a,0xb67c55,0x8a5a3c,0x5c3a26],HAIRC=[0x1a1410,0x4a2f1d,0x8a5a2b,0xd6b25e,0x9a9a9a],JACK=[0x1f2a44,0x6b6f76,0x2f4f3a,0x7a2e2e,0xc9b79c],PANT=[0x2c3e5c,0xc8b08a,0x3a3a3a];
const hex=n=>'#'+n.toString(16).padStart(6,'0');
const look={b:0,s:1,h:0,hc:1,j:0,p:0};let selFirm=0;
const OPTS=[['b','Build',['Feminine','Masculine']],['s','Skin tone',SKIN],['h','Hair style',['Short','Long','Bun']],['hc','Hair color',HAIRC],['j','Blazer',JACK],['p','Trousers',PANT]];

// ---------- scene ----------
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc3e6);scene.fog=new THREE.Fog(0x9fc3e6,70,170);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8070,0.65));
const sun=new THREE.DirectionalLight(0xfff1dc,0.7);sun.position.set(45,70,25);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-65,right:65,top:65,bottom:-65,far:200});sun.shadow.mapSize.set(2048,2048);scene.add(sun);

const UB=new THREE.BoxGeometry(1,1,1),mc={};
const mat=c=>mc[c]||(mc[c]=new THREE.MeshLambertMaterial({color:c}));
const wpos=(cx,cz,th,lx,lz)=>[cx+lx*Math.cos(th)+lz*Math.sin(th),cz-lx*Math.sin(th)+lz*Math.cos(th)];
function wbox(cx,cz,th,lx,ly,lz,sx,sy,sz,c,sh){const[x,z]=wpos(cx,cz,th,lx,lz);const m=new THREE.Mesh(UB,mat(c));m.scale.set(sx,sy,sz);m.position.set(x,ly,z);m.rotation.y=th;m.castShadow=sh!==false;m.receiveShadow=true;scene.add(m);return m;}
function plane(w,d,x,z,y,c){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(c));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m;}
function label(text,color,scale){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.font='bold 52px system-ui,Arial';g.textAlign='center';g.textBaseline='middle';
 let tw=g.measureText(text).width;if(tw>440){g.font='bold '+Math.floor(52*440/tw)+'px system-ui,Arial';tw=440;}const w=tw+40;g.fillStyle='rgba(10,18,28,.75)';g.beginPath();g.rect(256-w/2,24,w,80);g.fill();g.fillStyle=color||'#fff';g.fillText(text,256,66);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(scale,scale/4,1);s.renderOrder=10;return s;}

// ground, roads, sidewalks
plane(300,300,0,0,-0.01,0x7c7a74);
plane(10,100,0,0,0.02,0x373b42);plane(100,10,0,0,0.021,0x373b42);
for(const sx of[-1,1])for(const sz of[-1,1])plane(45,45,sx*27.5,sz*27.5,0.04,0x8f8b82);
plane(28,28,30,30,0.06,0x5aa050); // park
for(let i=8;i<=48;i+=6)for(const s of[-1,1]){plane(0.3,2.5,0,s*i,0.03,0xf2d35e);plane(2.5,0.3,s*i,0,0.031,0xf2d35e);}
for(const s of[-1,1])for(let i=-4;i<=4;i+=1.2){plane(0.6,2.6,i,s*6.8,0.032,0xeeeeee);plane(2.6,0.6,s*6.8,i,0.033,0xeeeeee);}
function tree(x,z,s){s=s||1;const t=new THREE.Mesh(new THREE.CylinderGeometry(0.2*s,0.28*s,2.6*s,7),mat(0x5b4129));t.position.set(x,1.3*s,z);t.castShadow=true;scene.add(t);
 [[0,4.0,0,1.9],[0.6,3.4,0.3,1.4],[-0.5,3.6,-0.4,1.5]].forEach(([a,b,c,r])=>{const l=new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,1),mat(0x4f9a45));l.position.set(x+a*s,b*s,z+c*s);l.castShadow=true;scene.add(l);});}
function lamp(x,z){const p=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,4.2,6),mat(0x22262b));p.position.set(x,2.1,z);scene.add(p);const l=new THREE.Mesh(new THREE.SphereGeometry(0.28,8,6),new THREE.MeshBasicMaterial({color:0xfff2c0}));l.position.set(x,4.3,z);scene.add(l);}
for(const s of[-1,1])for(const j of[11,23,35,47]){tree(s*6.4,j,1);tree(s*6.4,-j,1);tree(j,s*6.4,1);tree(-j,s*6.4,1);}
for(const s of[-1,1])for(const j of[17,29,41]){lamp(s*5.6,j);lamp(s*5.6,-j);lamp(j,s*5.6);lamp(-j,s*5.6);}
[[22,22],[38,22],[22,38],[38,38],[30,30],[26,34],[34,26],[24,30]].forEach(([x,z])=>tree(x,z,1.15));

// ---------- buildings ----------
const B=[],winList=[];let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};
const BRICK=[0x8a4b3a,0x9c5b45,0x7a4a3c,0xa8683f,0x6e4036,0xb08968,0xa9a39a];
const pickC=()=>BRICK[Math.floor(rnd()*BRICK.length)],pickH=()=>[12.8,12.8,16,16,19.2][Math.floor(rnd()*5)];
function addB(cx,cz,w,d,h,col,fx,fz,shop){
  const th=Math.atan2(fx,fz),sw=Math.abs(fx)>0.5;
  B.push({x:cx,z:cz,w:sw?d:w,d:sw?w:d});
  wbox(cx,cz,th,0,h/2,0,w,h,d,col);wbox(cx,cz,th,0,h+0.25,0.15,w+0.5,0.5,d+0.5,0xd9cfc0);wbox(cx,cz,th,0,0.5,0,w+0.2,1,d+0.2,0x6f6a62);
  const n=Math.floor(h/3.2),k=Math.max(3,Math.round(w/2.3));
  for(let f=0;f<n;f++)for(let i=0;i<k;i++){const lx=-w/2+w*(i+0.5)/k;
    if(f===0&&(shop||Math.abs(lx)<1.3))continue;
    winList.push([...wpos(cx,cz,th,lx,d/2+0.06),f===0?2.3:1.9+f*3.2,th]);}
  if(shop){wbox(cx,cz,th,0,2.2,d/2+0.06,w-1.2,2.8,0.12,0x7fb2c9,false);}
  else{wbox(cx,cz,th,0,1.6,d/2+0.07,1.3,2.4,0.1,0x2a1d17,false);wbox(cx,cz,th,0,0.3,d/2+0.7,2.4,0.6,1.4,0xcfc8bb);wbox(cx,cz,th,0,0.75,d/2+0.35,2.0,0.3,0.7,0xcfc8bb);}
}
for(const sx of[-1,1])for(const sz of[-1,1]){
  for(let i=0;i<4;i++){const o=7*i+19.5;addB(sx*12,sz*o,7,8,pickH(),pickC(),-sx,0);addB(sx*o,sz*12,7,8,pickH(),pickC(),0,-sz);}
  const cafe=sx===-1&&sz===1,office=sx===1&&sz===-1;
  addB(sx*12,sz*12,8,8,cafe?9:office?15:pickH(),cafe?0xc9a27a:office?0x9aa3ab:pickC(),-sx,0,cafe||office);
  if(!(sx===1&&sz===1))addB(sx*30,sz*30,12,12,28,pickC(),-sx,0);
}
(function buildWindows(){
  const F=new THREE.InstancedMesh(new THREE.BoxGeometry(1.45,2.1,0.12),mat(0xe8e2d6),winList.length);
  const P=new THREE.InstancedMesh(new THREE.BoxGeometry(1.15,1.75,0.16),new THREE.MeshLambertMaterial({color:0x2b3d52,emissive:0x0c1520}),winList.length);
  const o=new THREE.Object3D();
  winList.forEach((w,i)=>{o.position.set(w[0],w[2],w[1]);o.rotation.y=w[3];o.updateMatrix();F.setMatrixAt(i,o.matrix);P.setMatrixAt(i,o.matrix);});
  scene.add(F,P);
})();
// café details (corner at -12,12 facing the avenue) and firm office (12,-12)
wbox(-12,12,Math.PI/2,0,3.9,4.9,5.6,0.25,1.8,0x2f6b4a);
[[-6.8,10],[-6.8,12.5],[-6.8,15]].forEach(([x,z])=>{const t=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.9,10),mat(0x333333));t.position.set(x,0.5,z);scene.add(t);
  const u=new THREE.Mesh(new THREE.ConeGeometry(1.3,0.6,10),mat(0xe0b341));u.position.set(x,2.5,z);scene.add(u);const p=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,2,6),mat(0x444444));p.position.set(x,1.5,z);scene.add(p);});
let s1=label('Corner Café','#f5d7a0',6);s1.position.set(-6.6,5.2,12);scene.add(s1);
let s2=label('Vantage Realty Office','#ff8a7a',7);s2.position.set(6.6,6.2,-12);scene.add(s2);
let s3=label('Neighborhood Park','#c8f7c5',6);s3.position.set(30,6.5,30);scene.add(s3);
function collide(p){for(const b of B){const hx=b.w/2+0.5,hz=b.d/2+0.5,dx=p.x-b.x,dz=p.z-b.z;
  if(Math.abs(dx)<hx&&Math.abs(dz)<hz){const ox=hx-Math.abs(dx),oz=hz-Math.abs(dz);if(ox<oz)p.x=b.x+(dx<0?-hx:hx);else p.z=b.z+(dz<0?-hz:hz);}}}

// ---------- humanoid avatars ----------
function human(L,fc){
  const g=new THREE.Group(),skin=mat(SKIN[L.s]),jk=mat(JACK[L.j]),pt=mat(PANT[L.p]),hr=mat(HAIRC[L.hc]),bw=L.b?0.74:0.62;
  const add=(geo,m,x,y,z,par)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;(par||g).add(o);return o;};
  const legs=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*0.15,0.88,0);g.add(p);add(new THREE.CylinderGeometry(0.13,0.12,0.84,10),pt,0,-0.44,0,p);add(new THREE.BoxGeometry(0.2,0.1,0.34),mat(0x3b2a20),0,-0.85,0.06,p);return p;});
  add(new THREE.BoxGeometry(bw,0.72,0.34),jk,0,1.24,0);add(new THREE.BoxGeometry(bw*0.4,0.6,0.02),mat(0xeef3f8),0,1.26,0.175);
  if(fc)add(new THREE.SphereGeometry(0.05,8,6),mat(fc),bw*0.26,1.42,0.19);
  const arms=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*(bw/2+0.1),1.55,0);g.add(p);add(new THREE.CylinderGeometry(0.09,0.08,0.62,8),jk,0,-0.3,0,p);add(new THREE.SphereGeometry(0.085,8,6),skin,0,-0.66,0,p);return p;});
  add(new THREE.CylinderGeometry(0.07,0.08,0.12,8),skin,0,1.64,0);
  const head=add(new THREE.SphereGeometry(0.2,14,12),skin,0,1.85,0);head.scale.y=1.1;
  [-1,1].forEach(s=>add(new THREE.SphereGeometry(0.022,6,6),mat(0x222222),s*0.07,1.87,0.19));
  const cap=add(new THREE.SphereGeometry(0.215,14,10),hr,0,1.93,-0.015);cap.scale.set(1,0.7,1.02);
  if(L.h===1)add(new THREE.BoxGeometry(0.4,0.55,0.13),hr,0,1.66,-0.16);
  if(L.h===2)add(new THREE.SphereGeometry(0.1,8,6),hr,0,2.1,-0.15);
  g.userData={legs,arms,phase:0,amp:0};return g;
}
function walkAnim(g,dist,dt){const u=g.userData;if(dist>0.0005){u.phase+=dist*5.2;u.amp+=(1-u.amp)*Math.min(1,dt*10);}else u.amp+=(0-u.amp)*Math.min(1,dt*8);
  const s=Math.sin(u.phase)*0.7*u.amp;u.legs[0].rotation.x=s;u.legs[1].rotation.x=-s;u.arms[0].rotation.x=-s*0.8;u.arms[1].rotation.x=s*0.8;}
const avatars={};let me=null,myId=null,preview=null;
function makeAvatar(p){const f=FIRMS.find(x=>x.n===p.firm)||FIRMS[0];const root=new THREE.Group();const h=human(p.look||look,f.c);root.add(h);
  const nt=label(p.name,'#ffffff',3.4);nt.position.y=2.8;root.add(nt);const ft=label(p.firm,hex(f.c),3.4);ft.position.y=2.45;root.add(ft);
  root.position.set(p.x,0,p.z);scene.add(root);return{g:root,h,tx:p.x,tz:p.z,try:p.ry||0,px:p.x,pz:p.z};}
function setPreview(){if(preview)scene.remove(preview);preview=human(look,FIRMS[selFirm].c);preview.position.set(0,0,6);scene.add(preview);}

// ambient pedestrians (deterministic from clock, so every player sees them in the same place)
const PEDS=[];[['z',7,-46,46,1.5,0],['z',-7.2,-46,46,1.3,40],['z',7.4,-46,46,1.7,95],['x',7,-46,46,1.4,20],['x',-7.2,-46,46,1.6,70],['x',7.3,-46,46,1.2,130],['z',-6.8,-46,46,1.5,150],['x',-7,-46,46,1.3,10]]
 .forEach((d,i)=>{const L={b:i%2,s:(i*3)%5,h:i%3,hc:(i*2)%5,j:(i*2+1)%5,p:i%3};const h=human(L,null);scene.add(h);PEDS.push({h,d});});
function updatePeds(t,dt){PEDS.forEach(({h,d})=>{const[ax,fx,lo,hi,sp,off]=d,L=hi-lo,u=(t*sp+off)%(2*L),dir=u<L?1:-1,pos=u<L?lo+u:hi-(u-L);
  const nx=ax==='z'?fx:pos,nz=ax==='z'?pos:fx;const dist=Math.hypot(nx-h.position.x,nz-h.position.z);if(dist<5)walkAnim(h,dist,dt);
  h.position.set(nx,0,nz);h.rotation.y=ax==='z'?(dir>0?0:Math.PI):(dir>0?Math.PI/2:-Math.PI/2);});}

// ---------- UI ----------
const looksEl=document.getElementById('looks'),firmsEl=document.getElementById('firms');
OPTS.forEach(([k,title,items])=>{const l=document.createElement('label');l.textContent=title;looksEl.appendChild(l);const r=document.createElement('div');r.className='row';
  items.forEach((it,i)=>{const b=document.createElement('div');const col=typeof it==='number';b.className='opt'+(col?' sw':'')+(look[k]===i?' sel':'');if(col)b.style.background=hex(it);else b.textContent=it;
    b.onclick=()=>{look[k]=i;[...r.children].forEach((e,j)=>e.classList.toggle('sel',j===i));setPreview();};r.appendChild(b);});looksEl.appendChild(r);});
FIRMS.forEach((f,i)=>{const d=document.createElement('div');d.className='firm'+(i===0?' sel':'');d.style.setProperty('--c',hex(f.c));d.innerHTML='<b style="color:'+hex(f.c)+'">'+f.n+'</b><span>'+f.adv+'</span>';
  d.onclick=()=>{selFirm=i;[...firmsEl.children].forEach((e,j)=>e.classList.toggle('sel',j===i));setPreview();};firmsEl.appendChild(d);});
setPreview();
const socket=io();
document.getElementById('go').onclick=()=>{socket.emit('join',{name:document.getElementById('name').value.trim()||'Agent',firm:FIRMS[selFirm].n,look});document.getElementById('join').style.display='none';};
document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
function updateHud(){document.getElementById('hud').innerHTML='<b>'+(me?me.name:'')+'</b> &middot; '+(me?me.firm:'')+'<br>Agents online: '+Object.keys(avatars).length;}
socket.on('init',d=>{myId=d.id;if(preview){scene.remove(preview);preview=null;}Object.values(d.players).forEach(p=>{if(!avatars[p.id])avatars[p.id]=makeAvatar(p);});
  me=d.players[myId];me.ry=0;me.px=me.x;me.pz=me.z;document.getElementById('hud').style.display='block';document.getElementById('hint').style.display='block';updateHud();});
socket.on('joined',p=>{if(!avatars[p.id])avatars[p.id]=makeAvatar(p);updateHud();});
socket.on('left',id=>{if(avatars[id]){scene.remove(avatars[id].g);delete avatars[id];updateHud();}});
socket.on('state',st=>{for(const id in st){if(id===myId||!avatars[id])continue;avatars[id].tx=st[id].x;avatars[id].tz=st[id].z;avatars[id].try=st[id].ry;}});

// ---------- input + loop ----------
const keys={};let camYaw=0,camPitch=0.42,dragging=false;
addEventListener('keydown',e=>{if(document.activeElement.tagName!=='INPUT')keys[e.code]=true;});addEventListener('keyup',e=>{keys[e.code]=false;});
renderer.domElement.addEventListener('pointerdown',()=>dragging=true);addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{if(!dragging)return;camYaw-=e.movementX*0.005;camPitch=Math.max(0.12,Math.min(1.2,camPitch+e.movementY*0.004));});
const clock=new THREE.Clock();let sendT=0;
const angLerp=(a,b,t)=>a+((((b-a+Math.PI)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)-Math.PI)*t;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),0.05);updatePeds(Date.now()/1000,dt);
  if(me){
    if(keys.KeyQ)camYaw+=1.8*dt;if(keys.KeyE)camYaw-=1.8*dt;
    let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);const len=Math.hypot(ix,iz);
    if(len>0){ix/=len;iz/=len;const s=Math.sin(camYaw),c=Math.cos(camYaw),dx=ix*c+iz*s,dz=-ix*s+iz*c;
      me.x=Math.max(-48,Math.min(48,me.x+dx*6*dt));me.z=Math.max(-48,Math.min(48,me.z+dz*6*dt));collide(me);me.ry=Math.atan2(dx,dz);}
    const a=avatars[myId];if(a){const dist=Math.hypot(me.x-a.g.position.x,me.z-a.g.position.z);a.g.position.set(me.x,0,me.z);a.g.rotation.y=angLerp(a.g.rotation.y,me.ry,0.25);walkAnim(a.h,dist,dt);}
    sendT+=dt;if(sendT>0.066){sendT=0;socket.emit('move',{x:me.x,z:me.z,ry:me.ry});}
    const dd=11;camera.position.set(me.x+Math.sin(camYaw)*Math.cos(camPitch)*dd,1.8+Math.sin(camPitch)*dd,me.z+Math.cos(camYaw)*Math.cos(camPitch)*dd);camera.lookAt(me.x,1.5,me.z);
  }else{camera.position.set(0,1.9,11);camera.lookAt(-1.7,1.5,6);if(preview)preview.rotation.y+=dt*0.6;}
  for(const id in avatars){if(id===myId)continue;const a=avatars[id],ox=a.g.position.x,oz=a.g.position.z;
    a.g.position.x+=(a.tx-ox)*Math.min(1,12*dt);a.g.position.z+=(a.tz-oz)*Math.min(1,12*dt);a.g.rotation.y=angLerp(a.g.rotation.y,a.try,0.2);
    walkAnim(a.h,Math.hypot(a.g.position.x-ox,a.g.position.z-oz),dt);}
  renderer.render(scene,camera);}
loop();
